<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORCX - End-to-End Encrypted Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { 
            font-family: 'Geist Mono', monospace; 
            background: #f0f1f5; 
            color: #0d0d12; 
            --accent: #3a5cff;
            --border: rgba(0,0,0,0.09);
            --surface: rgba(255,255,255,0.95);
            --glass: rgba(255,255,255,0.88);
            --msg-bot: rgba(0,0,0,0.07);
            --shadow: rgba(0,0,0,0.13);
            --error: #ff5f57;
            --success: #34c759;
        }
        body.dark { 
            background: #090a0f; 
            color: #eeeef2;
            --accent: #5b7aff;
            --border: rgba(255,255,255,0.10);
            --surface: #0e0f16;
            --glass: rgba(16,17,26,0.93);
            --msg-bot: rgba(255,255,255,0.09);
            --shadow: rgba(0,0,0,0.55);
        }

        /* AUTH SCREEN */
        #authScreen { 
            position: fixed; 
            inset: 0; 
            z-index: 200; 
            background: #090a0f; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 32px 24px; 
        }
        #authScreen.hidden { display: none; }
        .auth-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 48px; color: var(--accent); letter-spacing: 0.12em; margin-bottom: 8px; }
        .auth-sub { font-size: 10px; opacity: 0.3; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 36px; }
        .auth-card { 
            width: 100%; 
            max-width: 340px; 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: 20px; 
            padding: 28px 22px; 
        }
        .auth-tabs { display: flex; gap: 8px; margin-bottom: 22px; }
        .auth-tab { 
            flex: 1; 
            padding: 10px; 
            border-radius: 10px; 
            border: none; 
            font-family: 'Geist Mono', monospace; 
            font-size: 12px; 
            cursor: pointer; 
            background: rgba(255,255,255,0.06); 
            color: rgba(255,255,255,0.4); 
            transition: all 0.2s;
        }
        .auth-tab.active { background: var(--accent); color: #fff; }
        .auth-field { margin-bottom: 14px; }
        .auth-field label { font-size: 10px; opacity: 0.4; letter-spacing: 0.1em; text-transform: uppercase; display: block; margin-bottom: 6px; }
        .auth-field input { 
            width: 100%; 
            padding: 11px 13px; 
            background: rgba(255,255,255,0.06); 
            border: 1px solid rgba(255,255,255,0.09); 
            border-radius: 11px; 
            color: #eeeef2; 
            font-family: 'Geist Mono', monospace; 
            font-size: 13px;
            transition: border 0.2s;
        }
        .auth-field input:focus { border-color: var(--accent); outline: none; }
        .auth-btn { 
            width: 100%; 
            padding: 13px; 
            background: var(--accent); 
            color: #fff; 
            border: none; 
            border-radius: 11px; 
            font-family: 'Syne', sans-serif; 
            font-weight: 700; 
            font-size: 14px; 
            cursor: pointer; 
            margin-top: 4px; 
            letter-spacing: 0.05em;
            transition: opacity 0.2s;
        }
        .auth-btn:active { opacity: 0.82; }
        .auth-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .auth-err { font-size: 11px; color: var(--error); margin-top: 10px; text-align: center; min-height: 16px; }

        /* HEADER */
        .hdr { position: fixed; top: 0; left: 0; right: 0; z-index: 60; padding: 12px 14px; background: var(--glass); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); }
        .hdr-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .hdr-center { flex: 1; text-align: center; min-width: 0; }
        .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.12em; color: var(--accent); white-space: nowrap; }
        .logo-sub { font-size: 8px; opacity: 0.35; letter-spacing: 0.12em; text-transform: uppercase; margin-top: 1px; }
        .hdr-btn { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            padding: 8px 11px; 
            cursor: pointer; 
            font-size: 16px; 
            color: inherit; 
            font-family: inherit; 
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .hdr-btn:active { transform: scale(0.92); }
        .ws-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex-shrink: 0; transition: background 0.3s; }
        .ws-dot.online { background: var(--success); }

        /* LAYOUT */
        .root { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
        .main { position: fixed; top: 56px; left: 0; right: 0; bottom: 158px; display: flex; overflow: hidden; }
        .sidebar { 
            width: 220px; 
            background: var(--surface); 
            border-right: 1px solid var(--border); 
            overflow-y: auto; 
            padding: 8px 0;
            display: none;
        }
        .sidebar.show { display: block; }
        .msgs { 
            position: relative; 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px 14px 6px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px;
        }

        /* CHAT LIST */
        .chat-item { 
            padding: 10px 12px; 
            border-radius: 10px; 
            cursor: pointer; 
            border: 1px solid transparent; 
            transition: all 0.2s;
            font-size: 12px;
        }
        .chat-item:hover { background: rgba(0,0,0,0.05); }
        .chat-item.active { background: var(--accent); color: #fff; }
        body.dark .chat-item:hover { background: rgba(255,255,255,0.08); }

        /* WELCOME */
        .welcome { position: absolute; top: 50%; left: 50%; margin: -60px 0 0 -120px; width: 240px; text-align: center; pointer-events: none; }
        .welcome h2 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 0.08em; color: var(--accent); }
        .welcome p { font-size: 10px; opacity: 0.32; letter-spacing: 0.14em; text-transform: uppercase; margin-top: 5px; }

        /* MESSAGES */
        .msg { 
            max-width: 82%; 
            padding: 9px 13px; 
            border-radius: 16px; 
            font-size: 14px; 
            line-height: 1.5; 
            word-break: break-word; 
            animation: msgIn 0.18s ease-out both; 
            position: relative;
        }
        .msg.you { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 3px; }
        .msg.them { background: var(--msg-bot); align-self: flex-start; border-bottom-left-radius: 3px; }
        .msg-meta { font-size: 9px; opacity: 0.5; margin-bottom: 3px; display: flex; gap: 5px; align-items: center; }
        .msg.you .msg-meta { justify-content: flex-end; }
        .mname { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 10px; }
        .msg-img { max-width: 100%; border-radius: 10px; margin-top: 4px; display: block; }
        .tick { font-size: 10px; opacity: 0.55; }
        .tick.read { color: var(--success); opacity: 1; }
        .msg-reactions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
        .reaction-btn { 
            background: rgba(0,0,0,0.1); 
            border: none; 
            border-radius: 20px; 
            padding: 2px 7px; 
            font-size: 13px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 3px;
            transition: all 0.2s;
        }
        .reaction-btn:hover { background: rgba(0,0,0,0.2); }
        .reaction-btn span { font-size: 10px; opacity: 0.65; }
        .msg.you .reaction-btn { background: rgba(255,255,255,0.18); color: #fff; }

        /* TYPING INDICATOR */
        .typing-dots { display: flex; gap: 4px; padding: 3px 2px; }
        .typing-dots span { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.35; animation: pulse 1s infinite; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        /* INPUT */
        .inp-wrap { position: fixed; bottom: 14px; left: 10px; right: 10px; z-index: 40; }
        .inp-area { 
            background: var(--glass); 
            border: 1px solid var(--border); 
            border-radius: 22px; 
            box-shadow: 0 8px 32px var(--shadow); 
            backdrop-filter: blur(12px);
        }
        .inp-row { display: flex; gap: 7px; padding: 9px 10px; align-items: flex-end; }
        textarea { 
            flex: 1; 
            border: none; 
            background: transparent; 
            color: inherit; 
            outline: none; 
            font-family: 'Geist Mono', monospace; 
            font-size: 14px; 
            resize: none; 
            min-height: 40px; 
            max-height: 140px; 
            line-height: 1.4;
        }
        textarea::placeholder { opacity: 0.3; }
        .rb { 
            width: 40px; 
            height: 40px; 
            border-radius: 12px; 
            border: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .rb:active { transform: scale(0.91); }
        .rbplus { background: var(--msg-bot); color: inherit; border: 1px solid var(--border); font-size: 21px; }
        .rbsend { background: var(--accent); color: #fff; font-size: 18px; }
        .inp-footer { display: flex; align-items: center; justify-content: space-between; padding: 0 13px 9px; font-size: 10px; opacity: 0.4; }

        /* ANIMATIONS */
        @keyframes msgIn { 0% { opacity: 0; transform: translateY(8px) scale(0.97); } 100% { opacity: 1; transform: none; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* MODALS */
        .modal { position: fixed; inset: 0; z-index: 150; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { 
            background: var(--surface); 
            border-radius: 20px; 
            padding: 24px; 
            max-width: 360px; 
            width: 90%;
            border: 1px solid var(--border);
        }
        .modal-header { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 18px; margin-bottom: 16px; }
        .modal-btn-group { display: flex; gap: 8px; margin-top: 16px; }
        .modal-btn { 
            flex: 1; 
            padding: 10px; 
            border-radius: 10px; 
            border: none; 
            cursor: pointer; 
            font-size: 13px;
            transition: all 0.2s;
        }
        .modal-btn.primary { background: var(--accent); color: #fff; }
        .modal-btn.secondary { background: rgba(0,0,0,0.1); }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .sidebar { position: fixed; left: 0; top: 56px; bottom: 158px; width: 100%; z-index: 50; border-right: none; border-bottom: 1px solid var(--border); }
            .msgs { position: absolute; }
            .main { flex-direction: column; }
        }
    </style>
</head>
<body class="dark">
    <!-- AUTH SCREEN -->
    <div id="authScreen">
        <div class="auth-logo">WORCX</div>
        <div class="auth-sub">End-to-End Encrypted Chat</div>
        <div class="auth-card">
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Login</button>
                <button class="auth-tab" data-tab="register">Register</button>
            </div>
            <div id="loginForm" style="display:block;">
                <div class="auth-field">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="your_username">
                </div>
                <div class="auth-field">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                </div>
                <button class="auth-btn" onclick="app.login()">Login</button>
                <div class="auth-err" id="loginErr"></div>
            </div>
            <div id="registerForm" style="display:none;">
                <div class="auth-field">
                    <label>Username</label>
                    <input type="text" id="regUsername" placeholder="your_username">
                </div>
                <div class="auth-field">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="••••••••">
                </div>
                <div class="auth-field">
                    <label>Display Name</label>
                    <input type="text" id="regDisplayName" placeholder="Display Name (optional)">
                </div>
                <button class="auth-btn" onclick="app.register()">Register</button>
                <div class="auth-err" id="regErr"></div>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="root" id="appRoot" style="display:none;">
        <!-- HEADER -->
        <div class="hdr">
            <div class="hdr-row">
                <button class="hdr-btn" onclick="app.toggleSidebar()">☰</button>
                <div class="hdr-center">
                    <div class="logo">WORCX</div>
                    <div class="logo-sub" id="chatTitle">Select a conversation</div>
                </div>
                <div style="display:flex;gap:6px;align-items:center;">
                    <div class="ws-dot" id="wsIndicator"></div>
                    <button class="hdr-btn" onclick="app.toggleDarkMode()">◐</button>
                    <button class="hdr-btn" onclick="app.logout()">⏻</button>
                </div>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main">
            <!-- SIDEBAR -->
            <div class="sidebar" id="sidebar">
                <div style="padding:10px 8px;font-size:11px;opacity:0.5;text-transform:uppercase;letter-spacing:0.1em;">Conversations</div>
                <div id="chatList"></div>
            </div>

            <!-- MESSAGES -->
            <div class="msgs" id="msgs">
                <div class="welcome">
                    <h2>WORCX</h2>
                    <p>Select a conversation to start chatting</p>
                </div>
            </div>
        </div>

        <!-- INPUT AREA -->
        <div class="inp-wrap">
            <div class="inp-area">
                <div class="inp-row">
                    <textarea id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter'&&!event.shiftKey){app.sendMessage();event.preventDefault();}"></textarea>
                    <button class="rb rbplus" onclick="app.showMenu()">+</button>
                    <button class="rb rbsend" onclick="app.sendMessage()">→</button>
                </div>
                <div class="inp-footer">
                    <div class="inp-footer-l" id="inputStatus"></div>
                    <div id="charCount">0/4000</div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Menu</div>
            <div id="modalBody"></div>
            <div class="modal-btn-group">
                <button class="modal-btn secondary" onclick="app.closeModal()">Close</button>
                <button class="modal-btn primary" id="modalAction" style="display:none;" onclick="app.modalAction()">Action</button>
            </div>
        </div>
    </div>

    <script>
        // ═════════════════════════════════════════════════════
        // API CLIENT
        // ═════════════════════════════════════════════════════
        class APIClient {
            constructor(baseURL = '') {
                this.baseURL = baseURL || 'http://localhost:5000';
                this.token = localStorage.getItem('token');
            }

            async request(method, endpoint, body = null) {
                const options = {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        ...(this.token && { 'Authorization': `Bearer ${this.token}` })
                    }
                };
                if (body) options.body = JSON.stringify(body);
                
                const res = await fetch(`${this.baseURL}${endpoint}`, options);
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || data.message || 'Request failed');
                return data;
            }

            // AUTH
            async register(username, password, displayName) {
                const data = await this.request('POST', '/auth/register', { username, password, display_name: displayName });
                this.setToken(data.access_token);
                return data;
            }

            async login(username, password) {
                const data = await this.request('POST', '/auth/login', { username, password });
                this.setToken(data.access_token);
                return data;
            }

            async getMe() { return this.request('GET', '/auth/me'); }

            // USERS & FOLLOW
            async searchUsers(q) { return this.request('GET', `/users?q=${encodeURIComponent(q)}`); }
            async getUser(id) { return this.request('GET', `/users/${id}`); }
            async followUser(id) { return this.request('POST', `/users/${id}/follow`); }
            async unfollowUser(id) { return this.request('DELETE', `/users/${id}/follow`); }

            // MESSAGES
            async sendDM(recipientId, ciphertext, kind = 'text') {
                return this.request('POST', '/messages/dm', { recipient_id: recipientId, ciphertext, kind });
            }

            async getDMHistory(userId, limit = 100) {
                return this.request('GET', `/messages/dm/${userId}?limit=${limit}`);
            }

            // GROUPS
            async createGroup(name, memberIds = []) {
                return this.request('POST', '/groups', { name, member_ids: memberIds });
            }

            async getGroups() { return this.request('GET', '/groups'); }
            async getGroup(id) { return this.request('GET', `/groups/${id}`); }

            // REACTIONS
            async addReaction(messageId, emoji) {
                return this.request('POST', `/messages/${messageId}/reactions`, { emoji });
            }

            async removeReaction(messageId, emoji) {
                return this.request('DELETE', `/messages/${messageId}/reactions/${emoji}`);
            }

            setToken(token) {
                this.token = token;
                localStorage.setItem('token', token);
            }

            clearToken() {
                this.token = null;
                localStorage.removeItem('token');
            }
        }

        // ═════════════════════════════════════════════════════
        // MAIN APP
        // ═════════════════════════════════════════════════════
        const app = {
            api: new APIClient(),
            user: null,
            chats: [],
            messages: [],
            currentChatId: null,
            currentChatType: null, // 'dm' or 'group'
            ws: null,
            darkMode: true,
            sidebarOpen: false,

            async init() {
                if (this.api.token) {
                    try {
                        this.user = await this.api.getMe();
                        this.showApp();
                        await this.loadChats();
                        this.connectWebSocket();
                    } catch (e) {
                        this.logout();
                    }
                } else {
                    this.showAuth();
                }
                this.setupEventListeners();
            },

            setupEventListeners() {
                document.querySelectorAll('.auth-tab').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.auth-tab').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        const tab = e.target.dataset.tab;
                        document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
                        document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
                    });
                });

                document.getElementById('msgInput').addEventListener('input', (e) => {
                    const len = e.target.value.length;
                    document.getElementById('charCount').textContent = `${len}/4000`;
                });
            },

            async login() {
                const username = document.getElementById('loginUsername').value;
                const password = document.getElementById('loginPassword').value;
                try {
                    await this.api.login(username, password);
                    this.user = await this.api.getMe();
                    this.showApp();
                    await this.loadChats();
                    this.connectWebSocket();
                } catch (e) {
                    document.getElementById('loginErr').textContent = e.message;
                }
            },

            async register() {
                const username = document.getElementById('regUsername').value;
                const password = document.getElementById('regPassword').value;
                const displayName = document.getElementById('regDisplayName').value;
                try {
                    await this.api.register(username, password, displayName);
                    this.user = await this.api.getMe();
                    this.showApp();
                    await this.loadChats();
                    this.connectWebSocket();
                } catch (e) {
                    document.getElementById('regErr').textContent = e.message;
                }
            },

            logout() {
                this.api.clearToken();
                this.user = null;
                this.chats = [];
                this.messages = [];
                if (this.ws) this.ws.close();
                this.showAuth();
            },

            showAuth() {
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('appRoot').style.display = 'none';
            },

            showApp() {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('appRoot').style.display = 'flex';
            },

            async loadChats() {
                try {
                    // Load groups (simplified for demo)
                    // In production, also load DM history
                    const groups = await this.api.getGroups();
                    this.chats = groups.map(g => ({ id: g.id, name: g.name, type: 'group' }));
                    this.renderChatList();
                } catch (e) {
                    console.error('Failed to load chats:', e);
                }
            },

            renderChatList() {
                const list = document.getElementById('chatList');
                list.innerHTML = '';
                this.chats.forEach(chat => {
                    const item = document.createElement('div');
                    item.className = 'chat-item' + (this.currentChatId === chat.id ? ' active' : '');
                    item.textContent = chat.name;
                    item.onclick = () => this.selectChat(chat.id, chat.type);
                    list.appendChild(item);
                });
            },

            selectChat(chatId, type) {
                this.currentChatId = chatId;
                this.currentChatType = type;
                document.getElementById('chatTitle').textContent = this.chats.find(c => c.id === chatId)?.name || 'Chat';
                this.renderChatList();
                this.loadMessages();
            },

            async loadMessages() {
                try {
                    if (this.currentChatType === 'group') {
                        this.messages = await this.api.getGroup(this.currentChatId);
                    }
                    this.renderMessages();
                } catch (e) {
                    console.error('Failed to load messages:', e);
                }
            },

            renderMessages() {
                const msgsDiv = document.getElementById('msgs');
                msgsDiv.innerHTML = '';
                this.messages.forEach(msg => {
                    const msgEl = document.createElement('div');
                    msgEl.className = `msg ${msg.sender_id === this.user.id ? 'you' : 'them'}`;
                    msgEl.innerHTML = `
                        <div class="msg-meta">
                            <span class="mname">${msg.sender_id === this.user.id ? 'You' : 'User'}</span>
                        </div>
                        <div>${msg.ciphertext ? '[Encrypted]' : msg.content}</div>
                        ${msg.reactions?.length ? `
                            <div class="msg-reactions">
                                ${msg.reactions.map(r => `<button class="reaction-btn"><span>${r.emoji}</span></button>`).join('')}
                            </div>
                        ` : ''}
                    `;
                    msgsDiv.appendChild(msgEl);
                });
                msgsDiv.scrollTop = msgsDiv.scrollHeight;
            },

            async sendMessage() {
                const input = document.getElementById('msgInput');
                const text = input.value.trim();
                if (!text || !this.currentChatId) return;

                try {
                    // In production: encrypt text before sending
                    const ciphertext = btoa(text); // Simple base64 encoding for demo
                    await this.api.sendDM(this.currentChatId, ciphertext);
                    input.value = '';
                    document.getElementById('charCount').textContent = '0/4000';
                    // Reload messages
                    await this.loadMessages();
                } catch (e) {
                    console.error('Send failed:', e);
                }
            },

            connectWebSocket() {
                if (!this.api.token) return;
                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsURL = `${protocol}//${location.host}/ws?token=${this.api.token}`;
                
                try {
                    this.ws = new WebSocket(wsURL);
                    this.ws.onopen = () => {
                        this.updateWSIndicator(true);
                        console.log('WebSocket connected');
                    };
                    this.ws.onmessage = (e) => {
                        const msg = JSON.parse(e.data);
                        this.handleWSMessage(msg);
                    };
                    this.ws.onclose = () => {
                        this.updateWSIndicator(false);
                        setTimeout(() => this.connectWebSocket(), 3000);
                    };
                } catch (e) {
                    console.error('WebSocket error:', e);
                }
            },

            handleWSMessage(msg) {
                if (msg.type === 'message') {
                    this.messages.push(msg.data);
                    this.renderMessages();
                } else if (msg.type === 'typing') {
                    // Show typing indicator
                }
            },

            updateWSIndicator(online) {
                const dot = document.getElementById('wsIndicator');
                if (online) {
                    dot.classList.add('online');
                } else {
                    dot.classList.remove('online');
                }
            },

            toggleDarkMode() {
                this.darkMode = !this.darkMode;
                document.body.classList.toggle('dark');
                localStorage.setItem('darkMode', this.darkMode);
            },

            toggleSidebar() {
                this.sidebarOpen = !this.sidebarOpen;
                document.getElementById('sidebar').classList.toggle('show');
            },

            showMenu() {
                const modal = document.getElementById('modal');
                const body = document.getElementById('modalBody');
                body.innerHTML = `
                    <button class="modal-btn" onclick="app.closeModal();app.showCreateGroup()">+ New Group</button>
                    <button class="modal-btn" onclick="app.closeModal();app.showInvite()">📎 Invite Link</button>
                    <button class="modal-btn" onclick="app.closeModal();app.showSettings()">⚙️ Settings</button>
                `;
                modal.classList.add('show');
            },

            showCreateGroup() {
                const modal = document.getElementById('modal');
                document.getElementById('modalTitle').textContent = 'Create Group';
                document.getElementById('modalBody').innerHTML = `
                    <input type="text" placeholder="Group name" id="groupName" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);margin-bottom:10px;">
                `;
                document.getElementById('modalAction').style.display = 'block';
                document.getElementById('modalAction').textContent = 'Create';
                document.getElementById('modalAction').onclick = async () => {
                    const name = document.getElementById('groupName').value;
                    try {
                        await this.api.createGroup(name);
                        await this.loadChats();
                        this.closeModal();
                    } catch (e) {
                        alert('Error: ' + e.message);
                    }
                };
                modal.classList.add('show');
            },

            showInvite() {
                const modal = document.getElementById('modal');
                document.getElementById('modalTitle').textContent = 'Invite Link';
                document.getElementById('modalBody').innerHTML = `
                    <p style="font-size:12px;opacity:0.7;margin-bottom:10px;">Share this link to invite friends:</p>
                    <input type="text" value="${location.origin}?invite=${this.user.id}" readonly style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);">
                `;
                document.getElementById('modalAction').style.display = 'none';
                modal.classList.add('show');
            },

            showSettings() {
                const modal = document.getElementById('modal');
                document.getElementById('modalTitle').textContent = 'Settings';
                document.getElementById('modalBody').innerHTML = `
                    <p>Display Name: <strong>${this.user.display_name}</strong></p>
                    <p>Username: <strong>${this.user.username}</strong></p>
                `;
                document.getElementById('modalAction').style.display = 'none';
                modal.classList.add('show');
            },

            closeModal() {
                document.getElementById('modal').classList.remove('show');
            },

            modalAction() {
                // Override in specific modals
            }
        };

        // Initialize app on load
        window.addEventListener('load', () => app.init());
    </script>
</body>
</html>
