  <script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, Fragment } = React;

const API_BASE = "https://worx-by-t-arxs.onrender.com";
const WS_BASE  = "wss://worx-by-t-arxs.onrender.com/ws";
const TOKEN_KEY = "worcx_token";

// ---------- helpers ----------
function cn(...xs) { return xs.filter(Boolean).join(" "); }

async function api(method, path, body) {
  const token = localStorage.getItem(TOKEN_KEY);
  const headers = { "Content-Type": "application/json" };
  if (token) headers["Authorization"] = `Bearer ${token}`;
  const res = await fetch(`${API_BASE}${path}`, {
    method, headers, body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let msg = "API Error";
    try { const data = await res.json(); msg = data.detail || data.message || msg; } catch (_) {}
    throw new Error(msg);
  }
  return res.json();
}

const encode = (t) => btoa(unescape(encodeURIComponent(t)));
const decode = (b) => { try { return decodeURIComponent(escape(atob(b))); } catch (_) { return "[encrypted]"; } };

function Icon({ name, size = 16, strokeWidth = 2, className = "" }) {
  const paths = ICONS[name] || '';
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none"
         stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
      {paths.split('|').map((d, i) => <path key={i} d={d} />)}
    </svg>
  );
}

// ---------- Auth Screen ----------
function AuthScreen({ onAuthSuccess }) {
  const [mode, setMode] = useState("login");
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [displayName, setDisplayName] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault(); setError(""); setLoading(true);
    try {
      const path = mode === "login" ? "/auth/login" : "/auth/register";
      const body = mode === "login" ? { username, password } : { username, password, display_name: displayName };
      const res = await api("POST", path, body);
      localStorage.setItem(TOKEN_KEY, res.access_token);
      onAuthSuccess();
    } catch (err) { setError(err.message); } finally { setLoading(false); }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-[#090a0f] p-6 text-[#eeeef2] font-mono">
      <div className="absolute inset-0 overflow-hidden pointer-events-none opacity-20">
        <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-[#5b7aff] rounded-full blur-[120px]" />
        <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-[#3a5cff] rounded-full blur-[120px]" />
      </div>
      <div className="w-full max-w-sm relative z-10">
        <div className="text-center mb-10">
          <h1 className="text-5xl font-extrabold text-[#5b7aff] tracking-widest font-syne mb-2 drop-shadow-[0_0_15px_rgba(91,122,255,0.5)]">WORCX</h1>
          <p className="text-[10px] uppercase tracking-[0.2em] text-white/40">Secure End-to-End Comms</p>
        </div>
        <div className="bg-[#0e0f16]/80 backdrop-blur-xl border border-white/10 rounded-2xl p-6 shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
          <div className="flex gap-2 mb-6 p-1 bg-black/30 rounded-xl border border-white/5">
            <button onClick={() => setMode("login")} className={cn("flex-1 py-2 rounded-lg text-xs font-medium transition-all duration-300", mode === "login" ? "bg-[#5b7aff] text-white shadow-lg scale-[1.02]" : "text-white/40 hover:text-white/80")}>Login</button>
            <button onClick={() => setMode("register")} className={cn("flex-1 py-2 rounded-lg text-xs font-medium transition-all duration-300", mode === "register" ? "bg-[#5b7aff] text-white shadow-lg scale-[1.02]" : "text-white/40 hover:text-white/80")}>Register</button>
          </div>
          <form onSubmit={handleSubmit} className="space-y-4">
            <div>
              <label className="block text-[10px] uppercase tracking-widest text-white/40 mb-1.5">Username</label>
              <input type="text" required value={username} onChange={(e) => setUsername(e.target.value)} autoComplete="username"
                     className="w-full bg-black/20 border border-white/5 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#5b7aff] transition-colors placeholder:text-white/20"
                     placeholder="your_handle" />
            </div>
            {mode === "register" && (
              <div className="animate-slide-up">
                <label className="block text-[10px] uppercase tracking-widest text-white/40 mb-1.5">Display Name</label>
                <input type="text" value={displayName} onChange={(e) => setDisplayName(e.target.value)}
                       className="w-full bg-black/20 border border-white/5 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#5b7aff] transition-colors placeholder:text-white/20"
                       placeholder="Optional" />
              </div>
            )}
            <div>
              <label className="block text-[10px] uppercase tracking-widest text-white/40 mb-1.5">Password</label>
              <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} autoComplete={mode === "login" ? "current-password" : "new-password"}
                     className="w-full bg-black/20 border border-white/5 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#5b7aff] transition-colors placeholder:text-white/20"
                     placeholder="••••••••" />
            </div>
            {error && <div className="text-[#ff5f57] text-xs text-center py-2 bg-[#ff5f57]/10 rounded-lg animate-zoom-in">{error}</div>}
            <button type="submit" disabled={loading}
                    className="w-full mt-4 bg-[#5b7aff] text-white rounded-xl py-3.5 font-syne font-bold text-sm tracking-wide hover:bg-[#5b7aff]/90 active:scale-[0.98] transition-all disabled:opacity-50 disabled:pointer-events-none flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(91,122,255,0.3)]">
              {loading && <Icon name="Loader2" size={16} className="animate-spin" />}
              {loading ? "Authenticating..." : mode === "login" ? "Enter Protocol" : "Initialize Identity"}
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}

// ---------- root ----------
function App() {
  const [isAuthenticated, setIsAuthenticated] = useState(!!localStorage.getItem(TOKEN_KEY));
  const [user, setUser] = useState(null);
  const [theme, setTheme] = useState("dark");

  const loadUser = useCallback(async () => {
    try { const u = await api("GET", "/auth/me"); setUser(u); }
    catch (_) { localStorage.removeItem(TOKEN_KEY); setIsAuthenticated(false); }
  }, []);

  useEffect(() => { if (isAuthenticated) loadUser(); }, [isAuthenticated, loadUser]);

  if (!isAuthenticated) return <AuthScreen onAuthSuccess={() => setIsAuthenticated(true)} />;
  if (!user) return (
    <div className="h-screen flex items-center justify-center bg-[#090a0f] text-[#5b7aff] font-mono text-sm">
      <Icon name="Loader2" size={18} className="animate-spin mr-2"/> Loading Identity...
    </div>
  );

  return (
    <div className={cn(
      "h-screen w-full flex overflow-hidden font-mono",
      theme === "dark" ? "bg-[#090a0f] text-[#eeeef2] dark-theme" : "bg-[#f4f5f9] text-[#0d0d12] light-theme"
    )}>
      <AppShell
        user={user} setUser={setUser}
        onLogout={() => { localStorage.removeItem(TOKEN_KEY); setIsAuthenticated(false); setUser(null); }}
        theme={theme}
        onToggleTheme={() => setTheme((t) => (t === "dark" ? "light" : "dark"))}
      />
    </div>
  );
}

function AppShell({ user, onLogout, theme, onToggleTheme }) {
  const [activeTab, setActiveTab] = useState("chats");
  const [activeChat, setActiveChat] = useState(null);
  const [activeRoom, setActiveRoom] = useState(null);
  const [wsStatus, setWsStatus] = useState("offline");

  const [chats, setChats] = useState([]);
  const [discoverQuery, setDiscoverQuery] = useState("");
  const [discoverResults, setDiscoverResults] = useState([]);
  const [requests, setRequests] = useState([]);
  const [rooms, setRooms] = useState([]);

  const [showSettings, setShowSettings] = useState(false);
  const [showNewGroup, setShowNewGroup] = useState(false);
  const [incomingCall, setIncomingCall] = useState(null);

  const wsRef = useRef(null);
  const reconnectTimeoutRef = useRef(null);

  const [userCache, setUserCache] = useState({ [user.id]: user });
  const userCacheRef = useRef(userCache);
  useEffect(() => { userCacheRef.current = userCache; }, [userCache]);

  const fetchUser = useCallback(async (id) => {
    if (userCacheRef.current[id]) return userCacheRef.current[id];
    try {
      const u = await api("GET", `/users/${id}`);
      setUserCache((prev) => ({ ...prev, [id]: u }));
      return u;
    } catch (_) { return null; }
  }, []);

  const loadChats = useCallback(async () => {
    try {
      const [following, groups] = await Promise.all([
        api("GET", "/follow/following"),
        api("GET", "/groups"),
      ]);
      const newChats = [];
      for (const f of following) {
        const u = await fetchUser(f.followee_id);
        if (u) newChats.push({ id: `dm_${u.id}`, type: "dm", peerId: u.id, name: u.display_name || u.username, avatar: u.avatar, lastActivity: Date.now(), unreadCount: 0, is_private: u.is_private });
      }
      for (const g of groups) {
        newChats.push({ id: `group_${g.id}`, type: "group", groupId: g.id, name: g.name, avatar: g.avatar, lastActivity: Date.now(), unreadCount: 0, members: g.member_ids });
      }
      setChats(newChats);
    } catch (_) {}
  }, [fetchUser]);

  const loadRequests = useCallback(async () => {
    try {
      const reqs = await api("GET", "/follow/requests");
      setRequests(reqs);
      for (const r of reqs) await fetchUser(r.follower_id);
    } catch (_) {}
  }, [fetchUser]);

  useEffect(() => { loadChats(); loadRequests(); }, [loadChats, loadRequests]);

  const connectWs = useCallback(() => {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) return;
    setWsStatus("connecting");
    const ws = new WebSocket(`${WS_BASE}?token=${token}`);
    ws.onopen = () => setWsStatus("online");
    ws.onclose = () => {
      setWsStatus("offline");
      clearTimeout(reconnectTimeoutRef.current);
      reconnectTimeoutRef.current = setTimeout(connectWs, 3000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === "ready") setWsStatus("online");
        if (msg.type === "call_invite") setIncomingCall({ from_username: msg.from_username || "Someone", kind: msg.kind || "audio", call_id: msg.call_id });
        if (msg.type === "screenshot" || msg.type === "screenrecord") {
          alert(`Warning: ${msg.from_username} captured this conversation`);
        }
      } catch (_) {}
    };
    wsRef.current = ws;
    const pinger = setInterval(() => { if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "ping" })); }, 25000);
    return () => { clearInterval(pinger); ws.close(); clearTimeout(reconnectTimeoutRef.current); };
  }, []);

  useEffect(() => {
    const cleanup = connectWs();
    return () => { if (cleanup) cleanup(); };
  }, [connectWs]);

  const searchDiscover = useCallback(async (q) => {
    if (!q.trim()) return setDiscoverResults([]);
    try { const res = await api("GET", `/users?q=${encodeURIComponent(q)}`); setDiscoverResults(res); } catch (_) {}
  }, []);

  const handleFollow = async (userId) => { try { await api("POST", `/users/${userId}/follow`); searchDiscover(discoverQuery); loadChats(); } catch (_) {} };
  const handleAccept = async (reqId) => { try { await api("POST", `/follow/requests/${reqId}/accept`); loadRequests(); loadChats(); } catch (_) {} };
  const handleReject = async (reqId) => { try { await api("POST", `/follow/requests/${reqId}/reject`); loadRequests(); } catch (_) {} };

  const createRoom = async () => {
    try {
      const r = await api("POST", "/rooms", { name: "Ephemeral Room" });
      setRooms((prev) => [r, ...prev]);
      setActiveRoom(r); setActiveChat(null);
    } catch (_) {}
  };

  const generateInvite = async () => {
    try {
      const r = await api("POST", "/invite/generate", {});
      const url = r.url || `${API_BASE}/invite/${r.token}`;
      try { await navigator.clipboard.writeText(url); } catch (_) {}
      alert(`Invite link copied:\n${url}`);
    } catch (e) { alert("Failed to generate invite"); }
  };

  const isDetailView = activeChat || activeRoom;

  return (
    <div className="flex w-full h-full relative">
      {/* SIDEBAR */}
      <div className={cn(
        "flex-shrink-0 flex flex-col border-r w-72 md:relative absolute inset-y-0 left-0 z-20 transition-transform duration-300 ease-in-out bg-[var(--surface)]",
        isDetailView ? "-translate-x-full md:translate-x-0" : "translate-x-0"
      )} style={{ borderColor: 'var(--border)' }}>

      {badge && <div className="absolute right-3 bg-[#ff5f57] text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full">{badge}</div>}
    </button>

}

// ---------- Active Chat ----------
function ActiveChatView({ chat, onBack, ws, user, userCache, fetchUser }) {
  const [messages, setMessages] = useState([]);
  const [loading, setLoading] = useState(true);
  const [input, setInput] = useState("");
  const [editingMsg, setEditingMsg] = useState(null);
  const [typing, setTyping] = useState(false);
  const [showMembers, setShowMembers] = useState(false);
  const endRef = useRef(null);

  useEffect(() => {
    let active = true;
    setLoading(true); setMessages([]);
    const fetchHistory = async () => {
      try {
        const path = chat.type === "dm" ? `/messages/dm/${chat.peerId}?limit=200` : `/messages/group/${chat.groupId}?limit=500`;
        const msgs = await api("GET", path);
        if (active) {
          const ordered = [...msgs].reverse();
          setMessages(ordered);
          setLoading(false);
          ordered.forEach((m) => { if (m.sender_id && !userCache[m.sender_id] && m.sender_id !== -1) fetchUser(m.sender_id); });
        }
      } catch (_) { if (active) setLoading(false); }
    };
    fetchHistory();
    return () => { active = false; };
  }, [chat, fetchUser, userCache]);

  useEffect(() => {
    if (!ws) return;
    const handler = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === "message") {
          const m = msg.message;
          if ((chat.type === "dm" && (m.sender_id === chat.peerId || m.recipient_id === chat.peerId)) ||
              (chat.type === "group" && m.group_id === chat.groupId)) {
            setMessages((prev) => prev.some((old) => old.client_msg_id === m.client_msg_id) ? prev : [...prev, m]);
          }
        } else if (msg.type === "typing") {
          if ((chat.type === "dm" && msg.from === chat.peerId) || (chat.type === "group" && msg.group_id === chat.groupId)) {
            setTyping(msg.is_typing);
          }
        } else if (msg.type === "message_edited") {
          setMessages((prev) => prev.map((m) => (m.id === msg.message?.id ? msg.message : m)));
        } else if (msg.type === "message_deleted") {
          setMessages((prev) => prev.map((m) => (m.id === msg.message_id ? { ...m, deleted: true } : m)));
        } else if (msg.type === "reactions") {
          setMessages((prev) => prev.map((m) => (m.id === msg.message_id || m.client_msg_id === msg.client_msg_id ? { ...m, reactions: msg.reactions || [] } : m)));
        }
      } catch (_) {}
    };
    ws.addEventListener("message", handler);
    return () => ws.removeEventListener("message", handler);
  }, [ws, chat]);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages, typing]);

  const send = async () => {
    if (!input.trim()) return;
    const text = input.trim();
    setInput("");
    if (editingMsg) {
      try {
        await api("PATCH", `/messages/${editingMsg.id}`, { payloads: [{ recipient_id: chat.peerId || 0, ciphertext: encode(text) }] });
        setMessages((prev) => prev.map((m) => (m.id === editingMsg.id ? { ...m, ciphertext: encode(text), edited_at: new Date().toISOString() } : m)));
        setEditingMsg(null);
      } catch (_) {}
      return;
    }
    const clientId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
    const tempMsg = { id: Date.now(), sender_id: user.id, recipient_id: chat.peerId || 0, kind: "text", ciphertext: encode(text), client_msg_id: clientId, created_at: new Date().toISOString(), deleted: false, reactions: [] };
    setMessages((prev) => [...prev, tempMsg]);
    try {
      if (chat.type === "dm") {
        const res = await api("POST", "/messages/dm", { recipient_id: chat.peerId, ciphertext: encode(text), kind: "text", client_msg_id: clientId });
        setMessages((prev) => prev.map((m) => (m.client_msg_id === clientId ? { ...m, ...res, delivered: true } : m)));
      } else {
        const payloads = (chat.members || []).map((id) => ({ recipient_id: id, ciphertext: encode(text) }));
        const res = await api("POST", "/messages/group", { group_id: chat.groupId, payloads, kind: "text", client_msg_id: clientId });
        setMessages((prev) => prev.map((m) => (m.client_msg_id === clientId ? { ...m, ...res, delivered: true } : m)));
      }
    } catch (_) {}
  };

  const handleTyping = (val) => {
    setInput(val);
    if (ws && ws.readyState === WebSocket.OPEN) {
      const payload = chat.type === "dm"
        ? { type: "typing", to: chat.peerId, is_typing: val.length > 0 }
        : { type: "typing", group_id: chat.groupId, is_typing: val.length > 0 };
      try { ws.send(JSON.stringify(payload)); } catch (_) {}
    }
  };

  const handleReaction = async (msgId, emoji) => {
    try {
      await api("POST", `/messages/${msgId}/reactions`, { emoji });
      setMessages((prev) => prev.map((m) => (m.id === msgId
        ? { ...m, reactions: [...(m.reactions || []), { id: Date.now(), message_id: msgId, user_id: user.id, emoji, created_at: new Date().toISOString() }] }
        : m)));
    } catch (_) {}
  };
  const handleDelete = async (msgId) => {
    try { await api("DELETE", `/messages/${msgId}`); setMessages((prev) => prev.map((m) => (m.id === msgId ? { ...m, deleted: true } : m))); } catch (_) {}
  };

  return (
    <div className="flex-1 flex flex-col h-full bg-[var(--bg)] relative overflow-hidden">
      <div className="h-16 border-b flex items-center justify-between px-4 bg-[var(--glass)] backdrop-blur-xl shrink-0 sticky top-0 z-10" style={{ borderColor: 'var(--border)' }}>
        <div className="flex items-center gap-3">
          <button className="md:hidden p-2 -ml-2 rounded-lg opacity-60 hover:opacity-100 hover:bg-[var(--hover)] transition-colors" onClick={onBack}>
            <Icon name="ArrowLeft" size={18} />
          </button>
          <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-[var(--accent)] to-[#8a9eff] flex items-center justify-center font-bold text-white text-sm shadow-md overflow-hidden">
            {chat.avatar ? <img src={chat.avatar} alt="" className="w-full h-full object-cover" /> :
              (chat.type === "group" ? <Icon name="Hash" size={16} /> : chat.name.charAt(0).toUpperCase())}
          </div>
          <div>
            <div className="font-syne font-bold tracking-wide flex items-center gap-2">
              {chat.name}
              {chat.is_private && <Icon name="Lock" size={12} className="opacity-50" />}
            </div>
            <div className="text-[10px] opacity-50 flex items-center gap-1.5 uppercase tracking-widest">
              {chat.type === "dm" && <><div className="w-1.5 h-1.5 rounded-full bg-[#34c759] shadow-[0_0_5px_#34c759]" /> Online</>}
              {chat.type === "group" && "Group Conversation"}
            </div>
          </div>
        </div>
        <div className="flex items-center gap-1">
          <button className="p-2.5 rounded-xl opacity-60 hover:opacity-100 hover:bg-[var(--hover)] hover:text-[var(--accent)] transition-colors"><Icon name="Phone" size={18} /></button>
          <button className="p-2.5 rounded-xl opacity-60 hover:opacity-100 hover:bg-[var(--hover)] hover:text-[var(--accent)] transition-colors"><Icon name="Video" size={18} /></button>
          <div className="w-px h-6 bg-[var(--border)] mx-1" />
          <button onClick={() => setShowMembers(!showMembers)} className={cn("p-2.5 rounded-xl transition-colors", showMembers ? "bg-[var(--accent)] text-white" : "opacity-60 hover:opacity-100 hover:bg-[var(--hover)]")}>
            <Icon name="Users" size={18} />
          </button>
        </div>
      </div>

      <div className="flex-1 flex overflow-hidden relative">
        <div className="flex-1 p-4 overflow-y-auto flex flex-col gap-4">
          {loading ? (
            <div className="flex-1 flex flex-col gap-5 py-4">
              <div className="self-start w-64 h-12 bg-[var(--hover)] rounded-2xl rounded-bl-sm animate-pulse" />
              <div className="self-start w-48 h-12 bg-[var(--hover)] rounded-2xl rounded-bl-sm animate-pulse" />
              <div className="self-end w-56 h-12 bg-[var(--hover)] rounded-2xl rounded-br-sm animate-pulse" />
            </div>
          ) : messages.length === 0 ? (
            <div className="flex-1 flex flex-col items-center justify-center opacity-30 text-sm gap-3">
              <Icon name="Shield" size={32} className="opacity-50" />
              <div className="font-bold font-syne tracking-wider">END-TO-END ENCRYPTED</div>
              <div className="text-xs uppercase tracking-widest">History is clean.</div>
            </div>
          ) : (
            messages.map((m, i) => {
              const isMe = m.sender_id === user.id;
              const text = m.deleted ? "Message deleted" : (m.ciphertext ? decode(m.ciphertext) : "");
              const senderUser = userCache[m.sender_id];
              const prev = messages[i - 1];
              const isConsecutive = prev && prev.sender_id === m.sender_id && (new Date(m.created_at).getTime() - new Date(prev.created_at).getTime() < 3 * 60 * 1000);
              const showDay = !prev || new Date(m.created_at).getDate() !== new Date(prev.created_at).getDate();
              return (
                <Fragment key={m.client_msg_id || m.id}>
                  {showDay && <div className="text-center text-[10px] uppercase tracking-widest opacity-40 my-4 font-semibold">{new Date(m.created_at).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' })}</div>}
                  <div className={cn("flex max-w-[85%] w-full", isMe ? "self-end justify-end" : "self-start", isConsecutive && !showDay ? "mt-[-8px]" : "animate-slide-up")}>
                    {!isMe && chat.type === "group" && (!isConsecutive || showDay) && (
                      <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-gray-600 to-gray-500 mr-2 shrink-0 flex items-center justify-center text-white text-xs font-bold mt-auto shadow-sm overflow-hidden">
                        {senderUser?.avatar ? <img src={senderUser.avatar} className="w-full h-full object-cover" /> :
                          (senderUser?.display_name?.charAt(0).toUpperCase() || senderUser?.username?.charAt(0).toUpperCase() || "?")}
                      </div>
                    )}
                    {(!isMe && chat.type === "group" && isConsecutive && !showDay) && <div className="w-10 shrink-0" />}
                    <div className="flex flex-col relative group" style={{ minWidth: 0 }}>
                      {!isMe && chat.type === "group" && (!isConsecutive || showDay) && (
                        <div className="text-[10px] opacity-50 ml-1 mb-1 font-semibold tracking-wide">{senderUser?.display_name || senderUser?.username || "Unknown"}</div>
                      )}
                      <div className={cn("px-4 py-2.5 text-[14px] leading-relaxed shadow-sm relative",
                        isMe ? "bg-[var(--accent)] text-white" : "bg-[var(--msg-them)] text-[var(--text)] border border-transparent",
                        isMe ? ((isConsecutive && !showDay) ? "rounded-l-2xl rounded-r-md" : "rounded-2xl rounded-br-sm") :
                               ((isConsecutive && !showDay) ? "rounded-r-2xl rounded-l-md" : "rounded-2xl rounded-bl-sm"),
                        m.deleted && "opacity-50 italic border-dashed border-[var(--border)] bg-transparent shadow-none text-center px-6")}>
                        {text}
                        <div className={cn("text-[9px] mt-1 flex items-center gap-1", isMe ? "text-white/60 justify-end" : "opacity-40")}>
                          {m.edited_at && <span className="mr-1">(edited)</span>}
                          {new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                          {isMe && <Icon name="CheckCheck" size={12} strokeWidth={3} className={cn("ml-1", m.delivered ? "text-white" : "opacity-50")} />}
                        </div>
                        {m.reactions && m.reactions.length > 0 && !m.deleted && (
                          <div className={cn("flex flex-wrap gap-1 mt-2 -mb-1", isMe ? "justify-end" : "justify-start")}>
                            {m.reactions.map((r, ri) => (
                              <div key={ri} className="bg-[var(--surface)] text-[var(--text)] text-[10px] px-1.5 py-0.5 rounded-full border border-[var(--border)] shadow-sm">{r.emoji}</div>
                            ))}
                          </div>
                        )}
                        {!m.deleted && (
                          <div className={cn("absolute -top-4 hidden group-hover:flex items-center gap-1 bg-[var(--surface)] border border-[var(--border)] rounded-lg p-0.5 shadow-lg",
                            isMe ? "right-0" : "left-0 z-10")}>
                            {['❤️','👍','😂','🔥','😮'].map((emoji) => (
                              <button key={emoji} onClick={() => handleReaction(m.id, emoji)} className="p-1.5 hover:bg-[var(--hover)] rounded text-[14px] leading-none transition-transform hover:scale-125">{emoji}</button>
                            ))}
                            {isMe && <div className="w-px h-4 bg-[var(--border)] mx-0.5" />}
                            {isMe && <button onClick={() => { setEditingMsg(m); setInput(decode(m.ciphertext || '')); }} className="p-1.5 hover:bg-[var(--hover)] rounded text-[var(--text)] opacity-70 hover:opacity-100"><Icon name="Edit2" size={14} /></button>}
                            {isMe && <button onClick={() => handleDelete(m.id)} className="p-1.5 hover:bg-[var(--hover)] rounded text-[#ff5f57]"><Icon name="Trash2" size={14} /></button>}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                </Fragment>
              );
            })
          )}
          {typing && (
            <div className="self-start flex items-center gap-2 bg-[var(--msg-them)] rounded-2xl rounded-bl-sm px-4 py-3 opacity-70 animate-slide-up">
              <div className="flex gap-1">
                <div className="w-1.5 h-1.5 rounded-full bg-current animate-bounce-dot" style={{ animationDelay: '0ms' }} />
                <div className="w-1.5 h-1.5 rounded-full bg-current animate-bounce-dot" style={{ animationDelay: '150ms' }} />
                <div className="w-1.5 h-1.5 rounded-full bg-current animate-bounce-dot" style={{ animationDelay: '300ms' }} />
              </div>
            </div>
          )}
          <div ref={endRef} className="h-1 shrink-0" />
        </div>

        {showMembers && chat.type === "group" && (
          <div className="w-64 border-l bg-[var(--surface)] flex flex-col shrink-0 animate-slide-left" style={{ borderColor: 'var(--border)' }}>
            <div className="p-4 border-b font-syne font-bold text-sm tracking-wide" style={{ borderColor: 'var(--border)' }}>Group Members</div>
            <div className="flex-1 overflow-y-auto p-2 space-y-1">
              {(chat.members || []).map((id) => {
                const u = userCache[id];
                if (!u) return null;
                return (
                  <div key={id} className="flex items-center gap-3 p-2 rounded-xl hover:bg-[var(--hover)]">
                    <div className="w-8 h-8 rounded-full bg-gray-500 flex items-center justify-center text-white font-bold text-xs overflow-hidden">
                      {u.avatar ? <img src={u.avatar} className="w-full h-full object-cover" /> :
                        (u.display_name?.charAt(0).toUpperCase() || u.username.charAt(0).toUpperCase())}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-semibold truncate">{u.display_name || u.username}</div>
                      <div className="text-[10px] opacity-50 truncate">@{u.username}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>

      <div className="p-3 bg-[var(--glass)] backdrop-blur-xl border-t shrink-0 z-10" style={{ borderColor: 'var(--border)' }}>
        {editingMsg && (
          <div className="flex items-center justify-between mb-2 px-2 text-xs text-[var(--accent)] font-medium animate-fade-in">
            <div className="flex items-center gap-2"><Icon name="Edit2" size={12} /> Editing message</div>
            <button onClick={() => { setEditingMsg(null); setInput(""); }} className="opacity-50 hover:opacity-100"><Icon name="X" size={14} /></button>
          </div>
        )}
        <div className={cn("flex items-end gap-2 bg-[var(--msg-them)] rounded-2xl p-1.5 border border-[var(--border)] transition-colors shadow-inner", input.trim() ? "border-[var(--accent)]" : "")}>
          <button className="w-10 h-10 rounded-xl flex items-center justify-center opacity-50 hover:opacity-100 hover:bg-[var(--hover)] shrink-0 transition-colors">
            <Icon name="Plus" size={20} />
          </button>
          <textarea value={input} onChange={(e) => handleTyping(e.target.value)}
                    onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
                    placeholder="Message..." rows={1}
                    className="flex-1 bg-transparent border-none resize-none outline-none max-h-32 py-3 px-2 text-sm" />
          <button onClick={send} disabled={!input.trim()} className="w-10 h-10 rounded-xl bg-[var(--accent)] text-white flex items-center justify-center shrink-0 hover:opacity-90 disabled:opacity-30 disabled:hover:opacity-30 transition-all shadow-[0_2px_10px_rgba(91,122,255,0.3)]">
            <Icon name={editingMsg ? "Check" : "Send"} size={18} />
          </button>
        </div>
      </div>
    </div>
  );
}

// ---------- Ephemeral Room ----------
function RoomView({ room, onBack, user }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [nickname] = useState(() => user.display_name || user.username);
  const wsRef = useRef(null);
  const endRef = useRef(null);

  useEffect(() => {
    const ws = new WebSocket(`wss://worx-by-t-arxs.onrender.com/ws/room/${room.token}?nickname=${encodeURIComponent(nickname)}`);
    ws.onmessage = (e) => {
      try {
        const m = JSON.parse(e.data);
        if (m.type === "room_message" || m.content) setMessages((prev) => [...prev, m]);
      } catch (_) {}
    };
    wsRef.current = ws;
    return () => ws.close();
  }, [room.token, nickname]);

  const send = () => {
    if (!input.trim()) return;
    const msg = { type: "room_message", content: input.trim(), kind: "text" };
    try { wsRef.current?.send(JSON.stringify(msg)); } catch (_) {}
    setMessages((prev) => [...prev, { ...msg, sender_nickname: nickname, created_at: new Date().toISOString() }]);
    setInput("");
  };

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

  return (
    <div className="flex-1 flex flex-col h-full bg-[var(--bg)] relative overflow-hidden" style={{ '--accent': 'var(--accent-incognito)' }}>
      <div className="absolute inset-0 opacity-5 pointer-events-none" style={{ backgroundImage: 'repeating-linear-gradient(45deg, var(--accent) 0, var(--accent) 1px, transparent 0, transparent 50%)', backgroundSize: '10px 10px' }} />
      <div className="h-16 border-b flex items-center justify-between px-4 bg-[var(--glass)] backdrop-blur-xl shrink-0 border-[var(--accent)]/20 sticky top-0 z-10">
        <div className="flex items-center gap-3">
          <button className="md:hidden p-2 -ml-2 rounded-lg opacity-60 hover:opacity-100 hover:bg-[var(--hover)] transition-colors" onClick={onBack}>
            <Icon name="ArrowLeft" size={18} />
          </button>
          <div className="w-10 h-10 rounded-full bg-gradient-to-br from-[var(--accent)] to-[#d97706] flex items-center justify-center text-white shadow-[0_0_15px_var(--accent)]">
            <Icon name="Flame" size={20} />
          </div>
          <div>
            <div className="font-syne font-bold tracking-wide text-[var(--accent)]">{room.name || "Incognito Room"}</div>
            <div className="text-[10px] opacity-70 uppercase tracking-widest text-[var(--accent)] font-semibold">Ephemeral Session</div>
          </div>
        </div>
        <button className="p-2.5 rounded-xl opacity-60 hover:opacity-100 hover:bg-[var(--accent)]/10 text-[var(--accent)] transition-colors"
                onClick={() => { try { navigator.clipboard.writeText(`${API_BASE}/rooms/${room.token}`); } catch (_) {} alert("Room link copied"); }}>
          <Icon name="Link" size={18} />
        </button>
      </div>

      <div className="flex-1 p-4 overflow-y-auto flex flex-col gap-4 z-10">
        {messages.length === 0 ? (
          <div className="flex-1 flex flex-col items-center justify-center opacity-60 text-sm gap-3 text-[var(--accent)]">
            <Icon name="Shield" size={40} className="opacity-50" />
            <div className="font-bold font-syne tracking-wider text-lg text-center">INCOGNITO MODE<br/>ACTIVE</div>
            <div className="text-xs uppercase tracking-widest text-center mt-2 opacity-70">Messages disappear<br/>when room closes.</div>
          </div>
        ) : (
          messages.map((m, i) => {
            const isMe = m.sender_nickname === nickname;
            return (
              <div key={i} className={cn("flex max-w-[85%] w-full animate-slide-up", isMe ? "self-end justify-end" : "self-start")}>
                <div className="flex flex-col" style={{ minWidth: 0 }}>
                  {!isMe && <div className="text-[10px] opacity-70 ml-1 mb-1 font-semibold text-[var(--accent)] uppercase tracking-wider">{m.sender_nickname}</div>}
                  <div className={cn("rounded-2xl px-5 py-3 text-[14px] leading-relaxed shadow-sm font-medium",
                    isMe ? "bg-gradient-to-br from-[var(--accent)] to-[#d97706] text-white rounded-br-sm shadow-[0_4px_15px_rgba(217,119,6,0.3)]" :
                           "bg-[#0e0f16] text-[#eeeef2] border border-[var(--accent)]/30 rounded-bl-sm")}>
                    {m.content}
                  </div>
                </div>
              </div>
            );
          })
        )}
        <div ref={endRef} className="h-1 shrink-0" />
      </div>

      <div className="p-3 bg-[var(--glass)] backdrop-blur-xl border-t border-[var(--accent)]/20 shrink-0 z-10">
        <div className="flex items-end gap-2 bg-[#0e0f16] rounded-2xl p-1.5 border border-[var(--accent)]/30 focus-within:border-[var(--accent)] transition-colors shadow-inner">
          <textarea value={input} onChange={(e) => setInput(e.target.value)}
                    onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
                    placeholder="Burn after reading..." rows={1}
                    className="flex-1 bg-transparent border-none resize-none outline-none max-h-32 py-3 px-4 text-sm text-[#eeeef2] placeholder:text-[#eeeef2]/30" />
          <button onClick={send} disabled={!input.trim()} className="w-10 h-10 rounded-xl bg-gradient-to-br from-[var(--accent)] to-[#d97706] text-white flex items-center justify-center shrink-0 hover:opacity-90 disabled:opacity-30 disabled:hover:opacity-30 transition-all shadow-[0_2px_10px_rgba(217,119,6,0.3)]">
            <Icon name="Flame" size={18} />
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
