<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>T-ARXS Secure Comm</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #050507;
            --bg-surface: #0a0a0e;
            --bg-elevated: #121218;
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #6b7280;
            --border: #1f2937;
            --danger: #ef4444;
            --success: #10b981;
            
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Typography */
        h1, h2, .brand { font-family: 'Syncopate', sans-serif; letter-spacing: 2px; text-transform: uppercase; }
        
        /* Auth Screen */
        #auth-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 24px;
            background: radial-gradient(circle at center, var(--bg-surface) 0%, var(--bg-base) 100%);
        }
        
        .auth-box {
            width: 100%;
            max-width: 360px;
            background: var(--bg-elevated);
            padding: 32px 24px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .auth-box h1 { color: var(--accent); font-size: 1.5rem; margin-bottom: 8px; text-align: center; }
        .auth-box p { color: var(--text-muted); font-size: 0.8rem; text-align: center; margin-bottom: 24px; }

        input {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 2px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--accent); }

        button {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px;
            font-family: 'Syncopate', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 2px;
            text-transform: uppercase;
        }
        button:hover { box-shadow: 0 0 12px var(--accent-glow); }
        button.secondary { background: transparent; border: 1px solid var(--border); margin-top: 12px; color: var(--text-muted); }
        button.secondary:hover { border-color: var(--text-main); color: var(--text-main); box-shadow: none; }

        /* Main App Layout */
        #app-view { display: none; height: 100%; flex-direction: column; }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
            margin-right: 8px;
        }
        .status-indicator.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }

        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar-section { padding: 16px; border-bottom: 1px solid var(--border); }
        .sidebar-title { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item {
            padding: 12px 16px;
            cursor: pointer;
            border-left: 2px solid transparent;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .chat-item:hover { background: var(--bg-elevated); color: var(--text-main); }
        .chat-item.active { border-left-color: var(--accent); background: var(--bg-elevated); color: var(--text-main); }

        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-base); }
        
        .chat-header {
            padding: 16px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
        }

        .messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message { max-width: 85%; }
        .message.self { align-self: flex-end; }
        .message.other { align-self: flex-start; }
        
        .msg-meta { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; }
        .message.self .msg-meta { text-align: right; }
        
        .msg-bubble {
            padding: 10px 14px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 2px;
            word-wrap: break-word;
        }
        .message.self .msg-bubble { background: rgba(79, 70, 229, 0.1); border-color: var(--accent); }

        /* Input Area */
        .input-area {
            padding: 16px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        .input-area input { margin: 0; flex: 1; }
        .input-area button { width: auto; padding: 0 24px; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                top: 0; bottom: 0; left: 0;
                transform: translateX(-100%);
                z-index: 20;
            }
            .sidebar.open { transform: translateX(0); box-shadow: 0 0 20px rgba(0,0,0,0.8); }
            .mobile-menu-btn { display: block !important; background: transparent; padding: 8px; width: auto; border: 1px solid var(--border); }
        }
        .mobile-menu-btn { display: none; }
    </style>
</head>
<body>

    <div id="auth-view">
        <div class="auth-box">
            <h1>T-ARXS</h1>
            <p>E2E Encrypted Protocol</p>
            
            <div id="login-form">
                <input type="text" id="username" placeholder="IDENTIFIER" autocomplete="off">
                <input type="password" id="password" placeholder="PASSPHRASE">
                <button onclick="app.authenticate('login')">Initialize Session</button>
                <button class="secondary" onclick="app.toggleAuthMode()">New Node Registration</button>
            </div>
            
            <div id="error-msg" style="color: var(--danger); font-size: 0.8rem; margin-top: 16px; text-align: center;"></div>
        </div>
    </div>

    <div id="app-view">
        <header>
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="mobile-menu-btn" onclick="app.toggleSidebar()">≡</button>
                <span class="brand">T-ARXS Terminal</span>
            </div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">
                <span class="status-indicator" id="ws-status"></span>
                <span id="current-user-display">OFFLINE</span>
            </div>
        </header>

        <div class="workspace">
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-title">Global Network</div>
                    <button class="secondary" style="padding: 8px; font-size: 0.7rem;" onclick="app.createNewRoom()">+ Spawn Incognito Room</button>
                </div>
                <div class="chat-list" id="chat-list">
                    </div>
            </aside>

            <main class="chat-area">
                <div class="chat-header">
                    <strong id="active-chat-title" style="color: var(--accent);">SELECT A SECURE CHANNEL</strong>
                </div>
                
                <div class="messages" id="messages-container">
                    </div>

                <div class="input-area">
                    <input type="text" id="message-input" placeholder="Transmit packet..." onkeypress="if(event.key === 'Enter') app.sendMessage()">
                    <button onclick="app.sendMessage()">SEND</button>
                </div>
            </main>
        </div>
    </div>

    <script>
        /** * ==========================================
         * CONFIGURATION & CONNECTION
         * ==========================================
         */
        
        // PASTE YOUR RENDER URL HERE (e.g., "https://tarxs-api.onrender.com")
        // Leave empty "" to default to localhost for local testing.
        const RENDER_API_URL = "https://worx-by-t-arxs.onrender.com"; 
        
        const BASE_URL = RENDER_API_URL || "http://localhost:5000";
        const WS_URL = BASE_URL.replace(/^http/, 'ws');

        /**
         * Core Application Logic
         */
        const app = {
            token: null,
            user: null,
            ws: null,
            activeContext: null, // { type: 'room'|'group'|'dm', id: string|number }
            isLoginMode: true,

            init() {
                this.token = localStorage.getItem('tarxs_token');
                if (this.token) {
                    this.fetchUserProfile();
                }
            },

            // --- UI Transitions ---
            toggleAuthMode() {
                this.isLoginMode = !this.isLoginMode;
                const btn = document.querySelector('#login-form button.secondary');
                const mainBtn = document.querySelector('#login-form button');
                mainBtn.textContent = this.isLoginMode ? "Initialize Session" : "Register Node";
                btn.textContent = this.isLoginMode ? "New Node Registration" : "Return to Login";
            },

            toggleSidebar() {
                document.getElementById('sidebar').classList.toggle('open');
            },

            showError(msg) {
                document.getElementById('error-msg').textContent = msg;
                setTimeout(() => document.getElementById('error-msg').textContent = "", 4000);
            },

            // --- Auth Flow ---
            async authenticate(action) {
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                if (!username || !password) return this.showError("Credentials required.");

                const endpoint = this.isLoginMode ? '/auth/login' : '/auth/register';
                
                try {
                    const res = await fetch(`${BASE_URL}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || "Authentication failed");

                    this.token = data.access_token;
                    localStorage.setItem('tarxs_token', this.token);
                    this.fetchUserProfile();

                } catch (err) {
                    this.showError(err.message);
                }
            },

            async fetchUserProfile() {
                try {
                    const res = await fetch(`${BASE_URL}/auth/me`, {
                        headers: { 'Authorization': `Bearer ${this.token}` }
                    });
                    if (!res.ok) throw new Error("Invalid session");
                    
                    this.user = await res.json();
                    
                    // Switch UI
                    document.getElementById('auth-view').style.display = 'none';
                    document.getElementById('app-view').style.display = 'flex';
                    document.getElementById('current-user-display').textContent = `NODE: ${this.user.username}`;
                    
                    this.connectGlobalWebSocket();
                    this.loadSidebarData();
                } catch (err) {
                    localStorage.removeItem('tarxs_token');
                    document.getElementById('auth-view').style.display = 'flex';
                    document.getElementById('app-view').style.display = 'none';
                }
            },

            // --- WebSockets ---
            connectGlobalWebSocket() {
                this.ws = new WebSocket(`${WS_URL}/ws?token=${this.token}`);
                
                this.ws.onopen = () => {
                    document.getElementById('ws-status').classList.add('connected');
                };

                this.ws.onmessage = (event) => {
                    const msg = JSON.parse(event.data);
                    this.handleIncomingSocket(msg);
                };

                this.ws.onclose = () => {
                    document.getElementById('ws-status').classList.remove('connected');
                    setTimeout(() => this.connectGlobalWebSocket(), 3000); // Auto-reconnect
                };
            },

            handleIncomingSocket(msg) {
                // Handle live DMs or Group messages received via the global hub
                if (msg.type === "message" && msg.data) {
                    const isRelevant = 
                        (this.activeContext?.type === 'dm' && (msg.data.sender_id === this.activeContext.id || msg.data.recipient_id === this.activeContext.id)) ||
                        (this.activeContext?.type === 'group' && msg.data.group_id === this.activeContext.id);

                    if (isRelevant) {
                        this.renderMessage({
                            sender: msg.data.sender_id === this.user.id ? 'You' : `User_${msg.data.sender_id}`,
                            content: this.decryptPayload(msg.data.ciphertext), // Placeholder decryption
                            isSelf: msg.data.sender_id === this.user.id
                        });
                    }
                }
            },

            // --- Rooms & Messaging ---
            async createNewRoom() {
                try {
                    const res = await fetch(`${BASE_URL}/rooms`, {
                        method: 'POST',
                        headers: { 
                            'Authorization': `Bearer ${this.token}`,
                            'Content-Type': 'application/json' 
                        },
                        body: JSON.stringify({ name: `Protocol_${Math.floor(Math.random() * 1000)}` })
                    });
                    const room = await res.json();
                    this.loadSidebarData(); // Refresh list
                    this.joinRoom(room.token, room.name);
                } catch (err) {
                    console.error("Failed to spawn room", err);
                }
            },

            async loadSidebarData() {
                // In a full implementation, you'd fetch /users, /groups, etc.
                // For this template, we'll mock the UI structure to show where they go.
                const list = document.getElementById('chat-list');
                list.innerHTML = `
                    <div style="padding: 16px; font-size: 0.7rem; color: var(--text-muted); text-align: center;">
                        [ Awaiting Network Peers ]<br>
                        Click '+ Spawn Incognito Room' to test WebSockets
                    </div>
                `;
            },

            // Connect specifically to the Ephemeral Room WebSocket
            roomWs: null,
            joinRoom(token, name) {
                this.activeContext = { type: 'room', id: token };
                document.getElementById('active-chat-title').textContent = `[ROOM] ${name}`;
                document.getElementById('messages-container').innerHTML = ''; // Clear chat
                
                if (window.innerWidth <= 768) this.toggleSidebar();

                if (this.roomWs) this.roomWs.close();

                this.roomWs = new WebSocket(`${WS_URL}/ws/room/${token}?nickname=${this.user.username}`);
                
                this.roomWs.onmessage = (event) => {
                    const msg = JSON.parse(event.data);
                    
                    if (msg.type === "room_message") {
                        this.renderMessage({
                            sender: msg.nickname,
                            content: msg.content, // Incognito rooms use plain content in your backend
                            isSelf: msg.nickname === this.user.username
                        });
                    } else if (msg.type === "room_join") {
                        this.renderSystemMessage(`${msg.nickname} established connection.`);
                    } else if (msg.type === "room_leave") {
                        this.renderSystemMessage(`${msg.nickname} disconnected.`);
                    }
                };
            },

            sendMessage() {
                const input = document.getElementById('message-input');
                const text = input.value.trim();
                if (!text || !this.activeContext) return;

                if (this.activeContext.type === 'room' && this.roomWs) {
                    // Send via Room WebSocket
                    this.roomWs.send(JSON.stringify({
                        type: "room_message",
                        content: text,
                        kind: "text"
                    }));
                    input.value = '';
                } else if (this.activeContext.type === 'dm') {
                    // Send via REST API (E2E Encrypted flow)
                    // Note: True DARcFibres implementation requires client-side keypair generation here.
                    const ciphertext = this.encryptPayload(text);
                    fetch(`${BASE_URL}/messages/dm`, {
                        method: 'POST',
                        headers: { 
                            'Authorization': `Bearer ${this.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ recipient_id: this.activeContext.id, ciphertext, kind: 'text' })
                    });
                    input.value = '';
                }
            },

            // --- UI Rendering ---
            renderMessage({ sender, content, isSelf }) {
                const container = document.getElementById('messages-container');
                const div = document.createElement('div');
                div.className = `message ${isSelf ? 'self' : 'other'}`;
                div.innerHTML = `
                    <div class="msg-meta">${sender}</div>
                    <div class="msg-bubble">${this.escapeHTML(content)}</div>
                `;
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
            },

            renderSystemMessage(text) {
                const container = document.getElementById('messages-container');
                const div = document.createElement('div');
                div.style.cssText = "align-self: center; font-size: 0.7rem; color: var(--text-muted); margin: 8px 0;";
                div.textContent = `— ${text} —`;
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
            },

            // --- Utilities ---
            escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            },

            // Placeholders for real E2E Crypto (e.g., WebCrypto API)
            encryptPayload(plaintext) { return btoa(unescape(encodeURIComponent(plaintext))); },
            decryptPayload(ciphertext) { return decodeURIComponent(escape(atob(ciphertext))); }
        };

        // Boot
        window.onload = () => app.init();
    </script>
</body>
</html>
